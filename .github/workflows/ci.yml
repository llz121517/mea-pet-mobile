name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  unit-test:
    name: 单元测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 21（与 gradle-daemon-jvm.properties 对齐）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # ubuntu runner 自带 Android SDK（含已接受许可证），AGP 会补齐缺失的 platform/build-tools
      # Windows 提交者常丢失 gradlew 的 exec 位，chmod 兜底（exit 126 Permission denied）
      - name: 跑 JVM 单元测试
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest --stacktrace

      - name: 上传测试报告（失败也可查）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: ignore
