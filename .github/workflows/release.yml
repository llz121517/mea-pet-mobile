name: Release

# 推送 v<版本> tag（如 v1.7.2，且提交已在 main 上）时自动：
#   解析版本 → 用 Environment「keystore」中的证书构建并签名 v7a / v8a / both 三档 APK
#   → 发布 GitHub Release（标题形如「v1.7.2 / 2026.9.11」）。
#
# 构建/签名与本地 tools/build-release.ps1（Windows）· tools/build-release.sh（Linux/macOS）同逻辑，
# 这里直接复用 .sh；版本校验、标题与 Release 正文由 tools/release_meta.py 生成。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要（重新）发布的 tag，例如 v1.7.2'
        required: true
        type: string

# 同一个 tag 的多次触发排队执行，避免两次发布互相覆盖
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write # 创建 Release、上传 APK

env:
  # 本次要发布的 tag（push 事件取 ref 名，手动触发取输入）
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  # Live2D Cubism Core SDK 版本（与 ci.yml 保持一致）
  CUBISM_SDK_VERSION: 5-r.5
  # 分 ABI 三档产物（与 tools/build-release.ps1 的 -Abis 默认值一致）
  ABIS: v7a v8a both

jobs:
  release:
    name: 构建 · 签名 · 发布
    runs-on: ubuntu-latest
    timeout-minutes: 90 # 三档 ABI 各跑一次 R8 release 构建，留足余量
    environment: keystore # 签名证书等 secret 配在这个 Environment 下
    steps:
      - name: 检出代码（完整历史 + tags，用于对比上个 tag）
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: 自检发布元数据逻辑
        run: python3 tools/test-release-meta.py

      - name: 校验 tag（须在 main 上、与 versionName 一致）
        id: meta
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin '+refs/heads/main:refs/remotes/origin/main'
          python3 tools/release_meta.py \
            --tag "$RELEASE_TAG" \
            --require-main \
            --github-output "$GITHUB_OUTPUT"

      # Live2D Cubism Core 受 Live2D 专有许可保护、不随仓库提交（app/libs/.gitignore 排除），
      # 从官方直链下载 Cubism Java SDK，解出 Core/android 下的 aar（步骤与 ci.yml 相同）。
      - name: 下载 Live2D Cubism Core
        run: |
          set -euo pipefail
          CORE="app/libs/Live2DCubismCore.aar"
          if [ ! -f "$CORE" ]; then
            ZIP="CubismSdkForJava-${CUBISM_SDK_VERSION}.zip"
            curl -fL --retry 3 --retry-delay 2 -o "$ZIP" \
              "https://cubism.live2d.com/sdk-java/bin/${ZIP}?event=cubism_sdk_download&sdk_type=Java&user_status=update&user_type=&version=${CUBISM_SDK_VERSION}&lang=en"
            unzip -o -q "$ZIP" "CubismSdkForJava-${CUBISM_SDK_VERSION}/Core/android/Live2DCubismCore.aar"
            mkdir -p app/libs
            cp "CubismSdkForJava-${CUBISM_SDK_VERSION}/Core/android/Live2DCubismCore.aar" "$CORE"
            rm -f "$ZIP"
          fi
          ls -l "$CORE"

      - name: 恢复签名证书与 local.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          UMENG_APP_KEY: ${{ secrets.UMENG_APP_KEY }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }

          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!name:-}" ] || fail "缺少 secret $name（Settings → Environments → keystore）"
          done

          ks="$RUNNER_TEMP/release.keystore"
          if ! printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$ks"; then
            fail "KEYSTORE_BASE64 不是合法的 base64"
          fi
          [ -s "$ks" ] || fail "KEYSTORE_BASE64 解码后为空"
          echo "签名证书已就绪：$(stat -c%s "$ks") 字节"

          # gradle（app/build.gradle.kts）与 tools/build-release.sh 都从 keystore.properties 读证书
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$ks" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

          # local.properties 不入库：CI 以 local.properties.example 为模板生成，
          # 友盟 AppKey 由 secret 注入；缺省时留空（统计 SDK 不初始化，其余功能正常）。
          cp local.properties.example local.properties
          if [ -z "${UMENG_APP_KEY:-}" ]; then
            echo "::warning::未配置 secrets.UMENG_APP_KEY，本次 release 构建不含统计上报"
          fi
          awk -v appkey="${UMENG_APP_KEY:-}" '
            /^umeng\.appKey=/ { print "umeng.appKey=" appkey; found = 1; next }
            { print }
            END { if (!found) print "umeng.appKey=" appkey }
          ' local.properties > local.properties.new
          mv local.properties.new local.properties

      - name: 构建并签名（v7a / v8a / both）
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          bash tools/build-release.sh
          echo "--- dist/ ---"
          ls -lh dist/

      - name: 校验 APK 签名
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          apksigner=""
          if [ -n "$sdk" ] && [ -d "$sdk/build-tools" ]; then
            apksigner="$(ls -1 "$sdk"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n1 || true)"
          fi
          if [ -z "$apksigner" ]; then
            echo "::warning::未找到 apksigner，跳过签名校验"
            exit 0
          fi
          digest=""
          for apk in dist/*.APK; do
            out="$("$apksigner" verify --print-certs "$apk")"
            one="$(printf '%s\n' "$out" | sed -nE 's/^Signer #1 certificate SHA-256 digest: *//p' | head -n1)"
            [ -n "$one" ] || { echo "::error::$apk 未通过签名校验"; exit 1; }
            if [ -n "$digest" ] && [ "$digest" != "$one" ]; then
              echo "::error::各 ABI 产物的签名证书不一致"; exit 1
            fi
            digest="$one"
            echo "OK $(basename "$apk") <- $one"
          done

      - name: 生成 Release 正文
        run: python3 tools/release_meta.py --tag "$RELEASE_TAG" --notes-file release-notes.md

      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          TITLE: ${{ steps.meta.outputs.title }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          set -euo pipefail
          [ -f release-notes.md ] || { echo "::error::缺少 release-notes.md"; exit 1; }

          # 带后缀的 tag（如 v1.6.0-beta1）照常发布，但标为 pre-release：
          # 不占 GitHub 的 "Latest"，App 的「检测更新」(/releases/latest) 也不会取到它。
          if [ "$PRERELEASE" = "true" ]; then
            latest_flags=(--prerelease)
          else
            latest_flags=(--latest)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在 → 更新标题/正文并覆盖上传 APK"
            gh release edit "$TAG" --title "$TITLE" --notes-file release-notes.md "${latest_flags[@]}"
            gh release upload "$TAG" dist/*.APK --clobber
          else
            gh release create "$TAG" dist/*.APK \
              --verify-tag --title "$TITLE" --notes-file release-notes.md "${latest_flags[@]}"
          fi
          echo "已发布：$(gh release view "$TAG" --json url --jq .url)"

      - name: 清理签名材料
        if: always()
        run: rm -f keystore.properties local.properties release-notes.md "$RUNNER_TEMP/release.keystore"
